<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raider Bucks - Settings</title>
    <link rel="stylesheet" href="settingsstyle.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="navbar">
            <div class="brand-title">
                <span class="raider-text">RAIDER</span>
                <span class="bucks-text">BUCKS</span>
            </div>

            <!-- Double T Logo -->
            <div class="logo-box">
                <img class="logo-image" src="images/logo.png" alt="Double T Logo" width="75" height="75">
            </div>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="balance.html">Balance</a>
                <a href="budget.html">Budget</a>
                <a href="map-page.html">Map</a>
                <div class="nav-avatar"></div>
            </nav>
        </header>

        <!-- User Profile Banner -->
        <section class="profile-banner">
            <div class="profile-avatar"></div>
            <div class="welcome-text">
                <h1>Welcome,<br>[Username]</h1>
            </div>
        </section>

        <!-- Main 3-Column Settings Grid -->
        <main class="settings-grid">
            
            <!-- Column 1: Meal Plan Settings -->
            <div class="settings-col">
                <div class="col-header">
                    <h2>Meal Plan Settings</h2>
                </div>
                <div class="col-body">
                    <div class="form-row">
                        <label>Meal Plan:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select-</option>
                                <option value=""> Plan 1</option>
                                <option value=""> Plan 2</option>
                                <option value=""> Plan 3</option>
                            </select>

                        </div>
                    </div>

                    <div class="form-row">
                        <label>Add Bucks:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value=""> $5</option>
                                <option value=""> $10</option>
                                <option value=""> $20</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Subtract Bucks:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value=""> $5</option>
                                <option value=""> $10</option>
                                <option value=""> $20</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Spending Limit:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value=""> $50</option>
                                <option value=""> $100</option>
                                <option value=""> $200</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row indented">
                        <label>Day/Week:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value=""> Daily</option>
                                <option value=""> Weekly</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Purchase Stopping:</label>
                        <div class="select-wrapper short">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value=""> Yes</option>
                                <option value=""> No</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 2: Notification Settings -->
            <div class="settings-col">
                <div class="col-header">
                    <h2>Notification Settings</h2>
                </div>
                <div class="col-body">
                    <div class="form-row">
                        <label>Balance Reminder:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value="">Yes</option>
                                <option value="">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Over-Balance warn:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value="">Yes</option>
                                <option value="">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Purchase Notifications:</label>
                        <div class="select-wrapper short">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value="">Yes</option>
                                <option value="">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="sub-heading">Where to send Notifications?</div>

                    <div class="form-row indented-sm">
                        <label>Raider Email:</label>
                        <div class="select-wrapper short">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value="">Yes</option>
                                <option value="">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row indented-sm">
                        <label>Personal Email:</label>
                        <div class="select-wrapper short">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value="">Yes</option>
                                <option value="">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row indented-sm">
                        <label>Text:</label>
                        <div class="select-wrapper short">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value="">Yes</option>
                                <option value="">No</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 3: Account Settings -->
            <div class="settings-col">
                <div class="col-header">
                    <h2>Account Settings</h2>
                </div>
                <div class="col-body">
                    <div class="form-row">
                        <label>Set Raider Email:</label>
                        <input type="email" class="line-input long">
                    </div>

                    <div class="form-row">
                        <label>Set Personal Email:</label>
                        <input type="email" class="line-input">
                    </div>

                    <div class="form-row">
                        <label>Set Phone Number:</label>
                        <input type="tel" class="line-input">
                    </div>

                    <div class="form-row">
                        <label>Set R-Number:</label>
                        <input type="text" class="line-input">
                    </div>

                    <div class="form-row">
                        <label>Set Dorm:</label>
                        <div class="select-wrapper">
                            <select>
                                <option value="">-Select Option-</option>
                                <option value="">Dorm 1</option>
                                <option value="">Dorm 2</option>
                                <option value="">Dorm 3</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
